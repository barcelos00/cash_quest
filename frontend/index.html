<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cash Quest</title>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cash Quest</title>
    
    <!-- Adicione esta linha: -->
    <link rel="icon" type="image/png" href="imagens/logo.png">   
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <header class="hero">
            <div>
                <h1>Cash Quest</h1>
                <p>Visão geral das suas finanças.</p>
            </div>
            <div class="header-actions">
                <button class="btn-logout" id="btnSair">Sair da Conta</button>
            </div>
        </header>

        <section class="summary-card">
            <div><span>Saldo Atual</span><strong id="displaySaldo">R$ 0,00</strong></div>
            <div><span>Entradas</span><strong id="displayReceitas" style="color: var(--success);">R$ 0,00</strong></div>
            <div><span>Saídas</span><strong id="displayDespesas" style="color: var(--danger);">R$ 0,00</strong></div>
        </section>

        <section class="controls">
            <div class="transaction-form">
                <h2>Nova Transação</h2>
                <form id="formTransacao">
                    <div class="field-group">
                        <label>Descrição</label>
                        <input type="text" name="descricao" placeholder="Ex: Salário, Conta de Luz..." required>
                    </div>
                    <div class="field-group">
                        <label>Valor (R$)</label>
                        <input type="number" step="0.01" name="valor" placeholder="0.00" required>
                    </div>
                    <div class="field-group">
                        <label>Tipo</label>
                        <select name="tipo">
                            <option value="receita">Receita (Entrada)</option>
                            <option value="despesa">Despesa (Saída)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Adicionar Transação</button>
                </form>
            </div>
            <div class="filters-card">
                <h2>Dica</h2>
                <p style="color: var(--muted); font-size: 0.95rem;">Mantenha suas despesas menores que suas receitas
                    para garantir a saúde financeira do seu Cash Quest.</p>
            </div>
        </section>

        <section class="table-section">
            <h2>Histórico de Movimentações</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTransacoes"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="toast" class="toast hidden">
        <span id="toastMsg">Notificação</span>
    </div>

    <script src="app.js"></script>
</body>

</html>
