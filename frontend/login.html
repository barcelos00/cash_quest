<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Quest - Autenticação</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Cash Quest</h2>
            <p>Gerencie suas finanças</p>
        </div>

        <!-- Abas de Navegação -->
        <div class="abas-container">
            <button id="btnAbaLogin" class="aba-btn ativa" onclick="mudarAba('login')">Entrar</button>
            <button id="btnAbaCadastro" class="aba-btn" onclick="mudarAba('cadastro')">Cadastrar</button>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" class="conteudo-aba ativa">
            <div class="field-group">
                <input type="text" name="usuario" placeholder="Nome de Usuário" required>
            </div>
            <div class="field-group">
                <input type="password" name="senha" placeholder="Senha" required>
            </div>
            <button type="submit">Entrar no Sistema</button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="form-cadastro" class="conteudo-aba">
            <div class="field-group">
                <input type="text" name="usuario" placeholder="Escolha um Usuário" required>
            </div>
            <div class="field-group">
                <input type="password" name="senha" placeholder="Crie uma Senha" required>
            </div>
            <button type="submit">Finalizar Cadastro</button>
        </form>

        <div id="msg" class="msg"></div>

        <!-- Botão Voltar ao Início -->
        <a href="index.html" class="btn-voltar">Voltar ao Início</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
